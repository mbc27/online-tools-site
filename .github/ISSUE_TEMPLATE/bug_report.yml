name: 🐛 Bug 反馈
description: 报告一个可以复现的问题
labels: ["bug"]
body:
  - type: textarea
    id: describe
    attributes:
      label: 问题描述
      description: 清晰地描述遇到的问题
      placeholder: 使用 XX 功能时，页面出现……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 xx 页面
        2. 点击 xx
        3. 出现 xx
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的结果是什么
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 部署方式
      options:
        - 本地 node server.js
        - PM2 / 服务器部署
        - 在线演示站点
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js 版本
      placeholder: "例如 20.11.0（node -v 查看）"
  - type: input
    id: browser
    attributes:
      label: 浏览器
      placeholder: "例如 Chrome 120 / Edge / Safari iOS 17"
  - type: textarea
    id: screenshot
    attributes:
      label: 截图或控制台报错
      description: 有截图或 F12 控制台报错能大大加快排查
    validations:
      required: false
