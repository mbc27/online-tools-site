name: ✨ 功能建议
description: 提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 目前哪一步用起来不方便，或者缺了什么
      placeholder: 现在添加工具时需要……希望能……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你理想中这个功能是怎么工作的
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 备选方案
      description: 有没有想过其它实现方式（选填）
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复的建议
          required: true
